[package]
name = "personal-finance-tool"
version = "1.0.0"
description = "Personal Finance Tool"
authors = ["Chris Contreras <317781444+chrisec04@users.noreply.github.com>"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

[lib]
name = "personal_finance_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Anthropic calls happen in Rust so the webview never receives a network capability.
# rustls keeps cold-clone builds off OpenSSL, which is brittle on Windows and Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The API key belongs in the OS keychain so exported finance data and app settings
# never become a second place where a long-lived Anthropic credential can leak.
keyring = "4"
